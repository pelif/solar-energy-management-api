name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=.*/DB_HOST=solar_energy_management_db/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=solar_energy_management/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=solar_energy_management/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=123456/' .env
      
      - name: Build and start Docker containers
        run: docker compose up -d --build
      
      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          timeout 60 bash -c 'until docker exec solar_energy_management_db mysqladmin ping -h localhost -u root -proot --silent; do sleep 2; done'
          echo "MySQL is ready!"
      
      - name: Install Composer dependencies
        run: docker exec solar_energy_management_app composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: Generate application key
        run: docker exec solar_energy_management_app php artisan key:generate
      
      - name: Run migrations
        run: docker exec solar_energy_management_app php artisan migrate --force
      
      - name: Run tests with coverage
        run: docker exec solar_energy_management_app php artisan test --coverage --min=0
      
      - name: Shutdown Docker containers
        if: always()
        run: docker compose down
